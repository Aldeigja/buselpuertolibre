# Repository hygiene only. Android format, analysis, unit-test, build,
# license, vulnerability, and emulator jobs are intentionally absent until
# buselpuertolibre contains a Gradle project. Do not mark those checks as
# successful from this workflow.

name: repository-security

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-security:
    name: repository-security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run repository security checks
        run: |
          set -euo pipefail
          python -m pip install "pre-commit==4.7.0"
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C "$RUNNER_TEMP/bin" gitleaks
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C "$RUNNER_TEMP/bin" actionlint
          chmod +x "$RUNNER_TEMP/bin/gitleaks" "$RUNNER_TEMP/bin/actionlint"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          test "$(gitleaks version)" = "8.30.1"
          test "$(actionlint -version | head -n 1)" = "1.7.12"
          pre-commit run --all-files --show-diff-on-failure
