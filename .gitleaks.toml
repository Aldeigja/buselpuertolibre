# Extends the rules compiled into gitleaks 8.30.1.
# Allowlist entries are appended to the default allowlists; they do not replace them.
# Do not add an allowlist for a real finding without the advisory-style review
# described in docs/quality-setup.md.

title = "El Puerto Bus repository"

[extend]
useDefault = true

[allowlist]
description = "Local tool cache, virtualenv, and Python bytecode. Not published source."
paths = [
    '''(?:^|/)\.tools(?:/|$)''',
    '''(?:^|/)\.venv(?:/|$)''',
    '''(?:^|/)__pycache__(?:/|$)''',
    '''(?:^|/)local(?:/|$)''',
]

[[rules]]
id = "machine-home-path"
description = "Absolute home or user profile paths in tracked content."
regex = '''(?:\x2FUsers\x2F[^/\s"']+\x2F|\x2Fhome\x2F[^/\s"']+\x2F|C:\\Users\\[^\\\s"']+\\)'''
tags = ["path", "privacy"]
